name: Oracle receiver release build

on:
  push:
    branches:
      - oracle-test-release-nov9
    paths:
      - "receiver/nroracledbreceiver/**"
      - "receiver/oracledbreceiver/**"
      - "internal/nrcommon/**"
      - ".nr-ci/oracledb/**"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.0"
          cache: false

      - name: Install OCB
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go install -trimpath -ldflags="-s -w" \
            go.opentelemetry.io/collector/cmd/builder@v0.162.0

      - name: Build collector binary
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/builder" --config .nr-ci/oracledb/builder-config.yaml

      - name: Verify oracledb receiver is registered
        run: |
          set -euo pipefail
          .nr-ci/oracledb/_build/nrdotcol components | grep -qi oracledb

      - name: Package
        run: |
          set -euo pipefail
          tar czf nrdotcol_linux_amd64.tar.gz -C .nr-ci/oracledb/_build nrdotcol

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          tag="oracle-${{ github.run_number }}-${short_sha}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" nrdotcol_linux_amd64.tar.gz \
            --title "Oracle receiver build $tag" \
            --notes "Built from commit ${{ github.sha }} on pre-release."
