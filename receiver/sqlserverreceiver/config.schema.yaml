$defs:
  connection_pool:
    description: ConnectionPool configures the shared database connection pool used by all scrapers of the receiver. Any field left unset falls back to a default derived from the number of scrapers (see setConnectionPoolSettings).
    type: object
    properties:
      max_idle:
        description: MaxIdle is the maximum number of idle connections kept in the pool.
        x-pointer: true
        type: integer
      max_idle_time:
        description: MaxIdleTime is the maximum amount of time a connection may be idle before being closed. Zero means connections are not closed due to idle time.
        x-pointer: true
        type: string
        format: duration
      max_lifetime:
        description: MaxLifetime is the maximum amount of time a connection may be reused. Zero means connections are reused forever.
        x-pointer: true
        type: string
        format: duration
      max_open:
        description: MaxOpen is the maximum number of open connections to the database. Zero means unlimited.
        x-pointer: true
        type: integer
  query_sample:
    type: object
    properties:
      max_rows_per_query:
        type: integer
        x-customType: uint64
  table_metadata_collection:
    description: TableMetadataCollection configures the collection of table structure and size inventory (db.server.table_metadata). Structure changes rarely, so this runs on its own, slower interval, decoupled from the main metrics scrape interval.
    type: object
    properties:
      collection_interval:
        description: CollectionInterval throttles how often the table inventory is refreshed.
        type: string
        format: duration
      max_tables:
        description: MaxTables caps the number of tables reported per database per poll, to bound worst-case payload size on very large schemas. 0 means use the default.
        type: integer
        x-customType: uint
  top_procedure_collection:
    description: TopProcedureCollection configures the collection of stored procedure statistics. Candidate rows are fetched up to MaxProcedureSampleCount, then the TopProcedureCount procedures with the largest elapsed-time delta over the interval are reported.
    type: object
    properties:
      collection_interval:
        description: CollectionInterval throttles the query and sets the window the deltas cover.
        type: string
        format: duration
      max_procedure_sample_count:
        type: integer
        x-customType: uint
      top_procedure_count:
        type: integer
        x-customType: uint
  top_query_collection:
    type: object
    properties:
      collection_interval:
        type: string
        format: duration
      lookback_time:
        description: Enabled enables the collection of the top queries by the execution time. It will collect the top N queries based on totalElapsedTimeDiffs during the last collection interval. The query statement will also be reported, hence, it is not ideal to send it as a metric. Hence we are reporting them as logs. The `N` is configured via `TopQueryCount`
        type: string
        format: duration
      max_query_sample_count:
        type: integer
        x-customType: uint
      top_query_count:
        type: integer
        x-customType: uint
  view_metadata_collection:
    description: ViewMetadataCollection configures the collection of view structure inventory (db.server.view_metadata). Off by default.
    type: object
    properties:
      collection_interval:
        description: CollectionInterval throttles how often the view inventory is refreshed.
        type: string
        format: duration
      max_views:
        description: MaxViews caps the number of views reported per database per poll. 0 means use the default.
        type: integer
        x-customType: uint
description: Config defines configuration for a sqlserver receiver.
type: object
properties:
  computer_name:
    type: string
  connection_pool:
    description: ConnectionPool tunes the shared database connection pool used by all scrapers of this receiver.
    $ref: connection_pool
  databases:
    description: Databases limits the per-database metrics and the events to the listed databases. Empty reports on every database.
    type: array
    items:
      type: string
  datasource:
    type: string
  db_auth:
    description: DBAuth optionally references a database credential provider extension. When set, the provider supplies the secret at connection time. Username remains available as provider input; a static password cannot be set.
    $ref: /config/configdbauth.id
  exclude_databases:
    description: ExcludeDatabases lists databases left out of the per-database metrics and the events. A database in both lists is excluded.
    type: array
    items:
      type: string
  instance_name:
    type: string
  password:
    $ref: go.opentelemetry.io/collector/config/configopaque.string
  port:
    type: integer
    x-customType: uint
  query_sample_collection:
    $ref: query_sample
  server:
    type: string
  table_metadata_collection:
    description: TableMetadataCollection configures the table structure/size inventory event.
    $ref: table_metadata_collection
  top_procedure_collection:
    $ref: top_procedure_collection
  top_query_collection:
    description: EnableTopQueryCollection enables the collection of the top queries by the execution time. It will collect the top N queries based on totalElapsedTimeDiffs during the last collection interval. The query statement will also be reported, hence, it is not ideal to send it as a metric. Hence we are reporting them as logs. The `N` is configured via `TopQueryCount`
    $ref: top_query_collection
  username:
    type: string
  view_metadata_collection:
    description: ViewMetadataCollection configures the view structure inventory event.
    $ref: view_metadata_collection
allOf:
  - $ref: go.opentelemetry.io/collector/scraper/scraperhelper.controller_config
  - $ref: ./internal/metadata.metrics_builder_config
  - $ref: ./internal/metadata.logs_builder_config
