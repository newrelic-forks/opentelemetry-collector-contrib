$defs:
  connection_pool:
    type: object
    properties:
      max_idle:
        x-pointer: true
        type: integer
      max_idle_time:
        x-pointer: true
        type: string
        format: duration
      max_lifetime:
        x-pointer: true
        type: string
        format: duration
      max_open:
        x-pointer: true
        type: integer
  query_sample_collection:
    type: object
    properties:
      max_rows_per_query:
        type: integer
        x-customType: int64
  table_metadata_collection:
    description: TableMetadataCollection configures the collection of table structure and size inventory (db.server.table_metadata). Structure changes rarely, so this runs on its own, slower interval, decoupled from the main metrics scrape interval.
    type: object
    properties:
      collection_interval:
        type: string
        format: duration
      max_tables:
        description: MaxTables caps the number of tables reported per database per poll, to bound worst-case payload size on very large schemas. 0 means use the default.
        type: integer
        x-customType: uint
  top_query_collection:
    type: object
    properties:
      collection_interval:
        type: string
        format: duration
      max_explain_each_interval:
        type: integer
        x-customType: int64
      max_rows_per_query:
        type: integer
        x-customType: int64
      query_plan_cache_size:
        type: integer
      query_plan_cache_ttl:
        type: string
        format: duration
      top_n_query:
        type: integer
        x-customType: int64
  view_metadata_collection:
    description: ViewMetadataCollection configures the collection of view structure inventory (db.server.view_metadata). Off by default.
    type: object
    properties:
      collection_interval:
        type: string
        format: duration
      max_views:
        description: MaxViews caps the number of views reported per database per poll. 0 means use the default.
        type: integer
        x-customType: uint
type: object
properties:
  connect_database:
    description: ConnectDatabase is the connection target for cluster-wide queries. Defaults to "postgres" (see createDefaultConfig). Independent of Databases (the reporting scope).
    type: string
  connection_pool:
    $ref: connection_pool
  databases:
    type: array
    items:
      type: string
  db_auth:
    description: DBAuth optionally sources the connection credential from a db_auth provider extension (e.g. AWS IAM) instead of a static password. When set, the provider supplies the password at connection-open time. Mutually exclusive with the top-level password field.
    $ref: /config/configdbauth.id
  exclude_databases:
    type: array
    items:
      type: string
  password:
    $ref: go.opentelemetry.io/collector/config/configopaque.string
  query_sample_collection:
    $ref: query_sample_collection
  table_metadata_collection:
    description: TableMetadataCollection configures the table structure/size inventory event.
    $ref: table_metadata_collection
  tls:
    $ref: go.opentelemetry.io/collector/config/configtls.client_config
  top_query_collection:
    $ref: top_query_collection
  username:
    type: string
  view_metadata_collection:
    description: ViewMetadataCollection configures the view structure inventory event.
    $ref: view_metadata_collection
allOf:
  - $ref: go.opentelemetry.io/collector/scraper/scraperhelper.controller_config
  - $ref: go.opentelemetry.io/collector/config/confignet.addr_config
  - $ref: ./internal/metadata.metrics_builder_config
  - $ref: ./internal/metadata.logs_builder_config
